# SLiMS production: MariaDB di host (deploy/server/04-mariadb-config.sh), container
# di network slims-net dengan subnet tetap, di-hardening, dan resource dibatasi.
# Jalankan lewat ./slims-prod.sh (check = dry-run, up, down, status, logs).
# Network slims-net dibuat oleh slims-prod.sh (external), agar container WAF bisa
# ikut bergabung dan network tidak hilang saat "docker compose down".
name: slims

services:
  slims:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3.36-apache-bookworm@sha256:cbd3b3d9011668443d54ab40ec31db56c73d91b4c8198935d639aa80d2d815c1}
    image: ${SLIMS_IMAGE:-slims-bulian:prod}
    container_name: ${SLIMS_CONTAINER:-slims-app}
    restart: unless-stopped
    environment:
      ENV: production
      DB_HOST: ${DB_HOST:-192.168.121.33}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-slims}
      DB_PASS: ${DB_PASS:?DB_PASS belum diisi di .env}
      DB_NAME: ${DB_NAME:-senayan}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-120}
      # IP asli pengunjung diambil dari header ini, hanya bila datang dari WAF.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-192.168.121.34}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-X-Forwarded-For}
    volumes:
      - files:/var/www/html/files
      - images:/var/www/html/images
      - repository:/var/www/html/repository
    # Hanya untuk uji dari server (curl/SSH tunnel). Pengunjung masuk lewat WAF.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8881}:80"
    networks:
      slims-net:
        # IP tetap, agar tidak mengambil IP WAF (TRUSTED_PROXY).
        ipv4_address: ${SLIMS_IP:-192.168.121.35}
    # --- keamanan container ---
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Minimal untuk entrypoint (chown/chmod config & files) dan Apache (bind :80,
    # turun ke www-data).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL, NET_BIND_SERVICE]
    tmpfs:
      - /tmp:size=${SLIMS_TMP_SIZE:-256m},mode=1777,noexec,nosuid,nodev
    # --- resource ---
    cpus: ${SLIMS_CPUS:-2}
    mem_limit: ${SLIMS_MEMORY:-1g}
    mem_reservation: ${SLIMS_MEMORY_RESERVATION:-256m}
    memswap_limit: ${SLIMS_MEMORY:-1g}
    pids_limit: ${SLIMS_PIDS:-512}
    ulimits:
      nofile: {soft: 4096, hard: 8192}
    logging:
      driver: json-file
      options: {max-size: "${LOG_MAX_SIZE:-10m}", max-file: "${LOG_MAX_FILE:-5}"}

networks:
  slims-net:
    external: true
    name: ${SLIMS_NETWORK:-slims-net}

volumes:
  files:
    name: slims_files
  images:
    name: slims_images
  repository:
    name: slims_repository
