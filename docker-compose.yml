# SLiMS 9 Bulian - Docker Compose
# Copy .env.example to .env and fill in the passwords before the first start.

services:
  slims:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3.36-apache-bookworm@sha256:cbd3b3d9011668443d54ab40ec31db56c73d91b4c8198935d639aa80d2d815c1}
    image: ${SLIMS_IMAGE:-slims-bulian:local}
    restart: unless-stopped
    environment:
      ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-slims}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_NAME: ${DB_NAME:-senayan}
    volumes:
      - appfiles:/var/www/html/files
      - appimages:/var/www/html/images
      - apprepo:/var/www/html/repository
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8881}:80"
    networks:
      - slims
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${MARIADB_IMAGE:-mariadb:lts}
    restart: unless-stopped
    # No published port: the database is reachable only from the slims service.
    volumes:
      - ./docker/db/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./install:/slims-sql:ro
      - dbdata:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MARIADB_DATABASE: ${DB_NAME:-senayan}
      MARIADB_USER: ${DB_USER:-slims}
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-false}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - slims

networks:
  slims:
    driver: bridge

volumes:
  dbdata:
  appfiles:
  appimages:
  apprepo:
