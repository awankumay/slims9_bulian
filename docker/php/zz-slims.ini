; SLiMS runtime overrides for the Docker image.

; Mitigation for PHP2Shell (CVE-2026-109618/109619/115560). SLiMS does not use
; upload progress tracking. This is defence in depth, not a substitute for a
; patched PHP (>= 8.3.36 / 8.4.27).
session.upload_progress.enabled = 0

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

session.cookie_httponly = 1
session.use_strict_mode = 1

upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 120
