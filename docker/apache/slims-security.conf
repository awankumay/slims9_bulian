# SLiMS hardening for the Docker image (mod_php).

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    # SLiMS itself sends a misspelled "nonsniff"; replace it.
    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # HTTPS is terminated in front of the container (Cloudflare Tunnel or a
    # reverse proxy), so Apache cannot tell the scheme. Browsers ignore HSTS
    # received over plain HTTP (RFC 6797 8.1), so direct http:// access on
    # HTTP_PORT keeps working.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # camera stays on for member/user photo capture and the barcode scanner.
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
</IfModule>

# Uploaded content must never be executed as PHP. Member card templates in
# files/membercard are loaded with require_once, not requested over HTTP.
<DirectoryMatch "^/var/www/html/(files|images|repository)/">
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
    php_admin_flag engine off
</DirectoryMatch>

<DirectoryMatch "^/var/www/html/(vendor|config|install|upgrade|cache|docker)/">
    Require all denied
</DirectoryMatch>

# Database backups (.sql and .sql.tar.gz, containing password hashes) are
# written under files/backup. They are downloaded through system/backup.php
# with a session and privilege check, never by direct URL, so block direct
# web access to the whole folder.
<DirectoryMatch "^/var/www/html/files/backup/">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(composer\.(json|lock)|\.env.*|.*\.(pem|key|py|sh|sql|md|log|dist|yml|yaml))$">
    Require all denied
</FilesMatch>
