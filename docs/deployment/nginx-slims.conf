# Contoh server block Nginx + PHP-FPM untuk SLiMS 9 Bulian.
# Salin ke /etc/nginx/sites-available/slims, sesuaikan server_name, root, dan
# socket PHP-FPM, lalu: ln -s ../sites-available/slims /etc/nginx/sites-enabled/
# Uji dengan: nginx -t && systemctl reload nginx
#
# Jika SLiMS dipasang di subfolder (mis. /slims), tambahkan awalan /slims pada
# semua location dan pada path error_page.

server {
    listen 80;
    server_name perpustakaan.example.ac.id;
    root /var/www/slims;
    index index.php index.html;

    client_max_body_size 32m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Halaman error bertema (errorpage.php). Kode dikirim lewat ?code= karena
    # fastcgi_params Nginx selalu mengisi REDIRECT_STATUS=200.
    error_page 400 /errorpage.php?code=400;
    error_page 401 /errorpage.php?code=401;
    error_page 403 /errorpage.php?code=403;
    error_page 404 /errorpage.php?code=404;
    error_page 405 /errorpage.php?code=405;
    error_page 408 /errorpage.php?code=408;
    error_page 413 /errorpage.php?code=413;
    error_page 414 /errorpage.php?code=414;
    error_page 429 /errorpage.php?code=429;
    error_page 500 /errorpage.php?code=500;
    error_page 502 /errorpage.php?code=502;
    error_page 503 /errorpage.php?code=503;
    error_page 504 /errorpage.php?code=504;

    # File dan folder tersembunyi (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
    }

    # Folder sensitif (setara docker/apache/slims-security.conf)
    location ~ ^/(config|vendor|install|upgrade|cache|docker|files/backup)/ {
        deny all;
    }

    # Jangan eksekusi PHP di folder upload
    location ~* ^/(files|images|repository)/.*\.(php[0-9]?|phtml|phar|pht)$ {
        deny all;
    }

    # File konfigurasi, skrip, dan dump database
    location ~* (^|/)(composer\.(json|lock)|.*\.(pem|key|py|sh|sql|md|log|dist|yml|yaml|inc\.php|tpl|theme|engine))$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /errorpage.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        # snippets/fastcgi-php.conf (Debian/Ubuntu) sudah berisi
        # "try_files $fastcgi_script_name =404", jadi file .php yang tidak ada
        # mendapat 404 dari Nginx (halaman error di atas). Di distro lain
        # tambahkan baris itu sendiri bersama "include fastcgi_params".
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Tidak memakai fastcgi_intercept_errors: error dari SLiMS sendiri
        # (404 OPAC di dalam tema, JSON API) tetap tampil apa adanya.
    }
}
